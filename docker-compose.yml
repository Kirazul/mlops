services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.1
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --allowed-hosts mlflow:5000,localhost:5000,127.0.0.1:5000
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=4)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # Initialise le registre avec un champion puis s'arrête.
  trainer:
    build: .
    image: churn-api:local
    command: ["python", "enregistrer_modele.py"]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      FORCE_RETRAIN: ${FORCE_RETRAIN:-0}
    depends_on:
      mlflow:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    image: churn-api:local
    ports:
      - "8000:8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_URI: models:/churn-model@champion
    depends_on:
      mlflow:
        condition: service_healthy
      trainer:
        condition: service_completed_successfully
    restart: on-failure

volumes:
  mlflow-data:
